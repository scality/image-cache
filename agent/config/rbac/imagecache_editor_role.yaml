# This rule is not used by the project image-cache-agent itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the image-cache.scality.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: image-cache-agent
    app.kubernetes.io/managed-by: kustomize
  name: imagecache-editor-role
rules:
- apiGroups:
  - image-cache.scality.com
  resources:
  - imagecaches
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - image-cache.scality.com
  resources:
  - imagecaches/status
  verbs:
  - get
