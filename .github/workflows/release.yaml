---
name: Release
run-name: Release new ${{ inputs.version-type }} from ${{ github.ref_name }}${{ inputs.dry-run && ' (dry run)' || '' }}

on:
  workflow_dispatch:
    inputs:
      version-type:
        description: "Version type"
        required: true
        type: choice
        default: "alpha"
        options: ["alpha", "beta", "GA"]
      version-scope:
        description: "Version scope"
        required: true
        type: choice
        default: "patch"
        options: ["patch", "minor", "major"]
      dry-run:
        description: "Compute and validate the tag without pushing it (from main only)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    uses: scality/workflows/.github/workflows/release.yaml@91619d883650e6238f517757f7b978757c2cb086 # v2.12.1
    with:
      version-type: ${{ inputs.version-type }}
      version-scope: ${{ inputs.version-scope }}
      actions-app-id: ${{ vars.ACTIONS_APP_ID }}
      dry-run: ${{ inputs.dry-run }}
    secrets: inherit
