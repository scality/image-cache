name: agent-image

on:
  workflow_call:
    inputs:
      is-latest:
        description: "Also move the latest (or latest-dev) tag"
        required: false
        default: false
        type: boolean
      is-stable:
        description: "Move latest instead of latest-dev"
        required: false
        default: false
        type: boolean

# One publish at a time per ref. GitHub keeps only one pending run per group
# and cancels it when a newer one arrives, so a shared group could drop a
# release build. Merges to main still run in order. A pre-release can race
# with a merge to main on latest-dev: if it finishes last, latest-dev points
# to the pre-release until the next merge that touches agent/.
concurrency:
  group: agent-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # git describe needs the tags and the history.
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: tags
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/image-cache-agent
          IS_LATEST: ${{ inputs.is-latest }}
          IS_STABLE: ${{ inputs.is-stable }}
        run: |
          # A tag push names the image after that tag: two tags can sit on
          # the same commit, and describe would pick one of them.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="$GITHUB_REF_NAME"
          else
            version="$(git describe --tags --always --match='v[0-9]*')"
          fi
          tags="$IMAGE:$version"
          if [ "$IS_LATEST" = "true" ]; then
            if [ "$IS_STABLE" = "true" ]; then
              tags="$tags,$IMAGE:latest"
            else
              tags="$tags,$IMAGE:latest-dev"
            fi
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: agent
          # The agent only ships for amd64 (see agent/DESIGN.md).
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=image-cache-agent
          cache-to: type=gha,mode=max,scope=image-cache-agent
