---
name: Promote
run-name: "Promote ${{ github.ref_name }}"

on:
  push:
    tags:
      - "v*"

jobs:
  # Runs before the release is created, so a broken image blocks the release.
  build:
    uses: ./.github/workflows/agent-image.yaml
    permissions:
      contents: read
      packages: write
    with:
      is-latest: true
      is-stable: ${{ ! contains(github.ref_name, '-') }}

  create-release:
    needs: build
    uses: scality/workflows/.github/workflows/promote.yaml@b7c7c5acf3cb73fdc905f2484a2dec59780b6e63 # v2.11.0
    permissions:
      contents: write

  attach-rpm:
    name: attach-rpm (el${{ matrix.el }})
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        el: [8, 9]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Build the RPMs
        env:
          EL: ${{ matrix.el }}
          VERSION: ${{ github.ref_name }}
        run: make -C rpm rpm EL="$EL" VERSION="$VERSION"
      - name: Attach the RPMs to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" rpm/_build/*.rpm --clobber
