name: rpm-ci

on:
  pull_request:
    branches: [main]
    paths:
      - 'rpm/**'
      - '.github/workflows/rpm-ci.yaml'
  push:
    branches: [main]
    paths:
      - 'rpm/**'
      - '.github/workflows/rpm-ci.yaml'

jobs:
  test:
    name: test (el${{ matrix.el }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        el: [8, 9]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run RPM package tests
        env:
          EL: ${{ matrix.el }}
        run: make -C rpm test EL="$EL"
