---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: imagecaches.image-cache.scality.com
spec:
  group: image-cache.scality.com
  names:
    kind: ImageCache
    listKind: ImageCacheList
    plural: imagecaches
    singular: imagecache
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.source
      name: Source
      type: string
    - jsonPath: .spec.cachePath
      name: CachePath
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ImageCache declares desired boot-cache content for a set of nodes. The
          agent reports per-node sync status through node labels
          (image-cache.scality.com/<name>: synced|pending), so the resource name
          should be chosen up front: metadata.generateName is discouraged.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of ImageCache
            properties:
              cachePath:
                default: /var/lib/image-cache
                description: |-
                  cachePath is the host directory under which the tarballs are
                  extracted, in a subdirectory named after this resource. It must
                  start with '/' and must not contain the substring '..' anywhere
                  (a plain substring check, not path-segment parsing).
                pattern: ^/
                type: string
                x-kubernetes-validations:
                - message: cachePath must not contain '..'
                  rule: '!self.contains(''..'')'
              nodeSelector:
                additionalProperties:
                  type: string
                description: |-
                  nodeSelector selects the nodes this cache applies to, by exact
                  key/value match against node labels (same semantics as a pod's
                  .spec.nodeSelector). Empty or absent selects every node.
                type: object
              source:
                description: |-
                  source is the reference of the image whose layers contain the
                  tarballs to cache. The reference uses the usual
                  registry/repository[:tag|@digest] form.
                minLength: 1
                type: string
            required:
            - source
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: 'name must not exceed 63 characters: it is used as a node label
            name'
          rule: size(self.metadata.name) <= 63
    served: true
    storage: true
    subresources: {}
