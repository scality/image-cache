name: rpm-ci

on:
  # No path filter on pull requests: a required status check that never runs
  # leaves the pull request waiting for it forever, so every pull request has
  # to report this workflow, even the ones that touch neither `rpm/` nor this
  # file. Pushes to `main` keep the filter, where nothing waits on them.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'rpm/**'
      # The imagecachectl package wraps a binary compiled from `agent/`, so a
      # change there changes what this workflow builds and asserts.
      - 'agent/**'
      - '.github/workflows/rpm-ci.yaml'

jobs:
  test:
    name: test (el${{ matrix.el }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        el: [8, 9]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Run RPM package tests
        env:
          EL: ${{ matrix.el }}
        run: make -C rpm test EL="$EL"
