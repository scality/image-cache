name: "Pre Merge"

permissions:
  contents: read

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Lint
        run: make -C agent lint

  test:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Run tests
        run: make -C agent test
      # `make test` first regenerates the CRDs, RBAC and deepcopy code, then
      # runs `go fmt`. Whatever they change must be committed: an edited API
      # type or RBAC marker, a controller-gen bump, or unformatted code.
      - name: Check make test left the tree clean
        if: ${{ !cancelled() }}
        run: |
          git diff
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }
      # Nothing else runs kustomize, so a kustomize bump would go untested.
      - name: Build the manifests with kustomize
        if: ${{ !cancelled() }}
        run: |
          make -C agent kustomize
          agent/bin/kustomize build agent/config/default > /dev/null

  image:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the container image
        run: make -C agent docker-build

  e2e:
    runs-on: ubuntu-26.04
    # Without a limit, a cluster that never gets ready holds the runner for
    # the 6 hour default.
    timeout-minutes: 30
    env:
      # Taken from the official image, so Renovate can bump the tag and the
      # digest together. kubectl supports a cluster one minor version away,
      # so it may move before KIND_VERSION in agent/Makefile.
      # renovate: datasource=docker depName=registry.k8s.io/kubectl
      KUBECTL_VERSION: v1.37.1@sha256:b7cab618e281b1ee7484e7b706a96e2135fbb6e072c2a573a7dab4e87d7f2385
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Install kubectl
        run: |
          id=$(docker create --platform linux/amd64 "registry.k8s.io/kubectl:${KUBECTL_VERSION}")
          sudo docker cp "$id":/bin/kubectl /usr/local/bin/kubectl
          docker rm "$id"
          kubectl version --client
      - name: Run the e2e tests
        run: make -C agent test-e2e

  rpm:
    name: rpm (el${{ matrix.el }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        el: [8, 9]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Run RPM package tests
        env:
          EL: ${{ matrix.el }}
        run: make -C rpm test EL="$EL"
